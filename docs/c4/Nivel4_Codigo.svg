<rect x="40" y="1080" width="1120" height="434" rx="10" fill="#1f2a37"/>
<text x="64" y="1118" font-size="16" fill="#7fb77e" xml:space="preserve" font-family="Consolas, 'Courier New', monospace">// app/Domain/Venta/Venta.php  (fragmento ilustrativo)</text>
<text x="64" y="1142" font-size="16" fill="#e6edf3" xml:space="preserve" font-family="Consolas, 'Courier New', monospace">class Venta</text>
<text x="64" y="1166" font-size="16" fill="#e6edf3" xml:space="preserve" font-family="Consolas, 'Courier New', monospace">{</text>
<text x="64" y="1190" font-size="16" fill="#e6edf3" xml:space="preserve" font-family="Consolas, 'Courier New', monospace">    private array $lineas = [];</text>
<text x="64" y="1238" font-size="16" fill="#e6edf3" xml:space="preserve" font-family="Consolas, 'Courier New', monospace">    public function agregarLinea(Producto $producto, int $cantidad): void</text>
<text x="64" y="1262" font-size="16" fill="#e6edf3" xml:space="preserve" font-family="Consolas, 'Courier New', monospace">    {</text>
<text x="64" y="1286" font-size="16" fill="#e6edf3" xml:space="preserve" font-family="Consolas, 'Courier New', monospace">        if ($producto-&gt;existencia &lt; $cantidad) throw new StockInsuficiente();</text>
<text x="64" y="1310" font-size="16" fill="#e6edf3" xml:space="preserve" font-family="Consolas, 'Courier New', monospace">        $this-&gt;lineas[] = new LineaVenta($producto, $cantidad);</text>
<text x="64" y="1334" font-size="16" fill="#e6edf3" xml:space="preserve" font-family="Consolas, 'Courier New', monospace">    }</text>
<text x="64" y="1382" font-size="16" fill="#e6edf3" xml:space="preserve" font-family="Consolas, 'Courier New', monospace">    public function calcularTotal(): float</text>
<text x="64" y="1406" font-size="16" fill="#e6edf3" xml:space="preserve" font-family="Consolas, 'Courier New', monospace">    {</text>
<text x="64" y="1430" font-size="16" fill="#e6edf3" xml:space="preserve" font-family="Consolas, 'Courier New', monospace">        return array_sum(array_map(fn($l) =&gt; $l-&gt;subtotal(), $this-&gt;lineas));</text>
<text x="64" y="1454" font-size="16" fill="#e6edf3" xml:space="preserve" font-family="Consolas, 'Courier New', monospace">    }</text>
<text x="64" y="1478" font-size="16" fill="#e6edf3" xml:space="preserve" font-family="Consolas, 'Courier New', monospace">}</text>
<text x="1220" y="1120" font-size="17" fill="#444" font-family="'Segoe UI', 'Open Sans', Arial, sans-serif">Relaciones:  ──▷ usa / dependencia    - - -▷ (triángulo) implementa    ◆── composición</text>
<text x="1220" y="1150" font-size="17" fill="#444" font-family="'Segoe UI', 'Open Sans', Arial, sans-serif">Flujo: el controlador recibe la lectura del producto → el servicio carga la Venta,</text>
<text x="1220" y="1180" font-size="17" fill="#444" font-family="'Segoe UI', 'Open Sans', Arial, sans-serif">aplica la promoción, recalcula subtotales/total y la guarda a través del puerto VentaRepository.</text>
<text x="40" y="1580" font-size="34" font-weight="700" fill="#111" font-family="'Segoe UI', 'Open Sans', Arial, sans-serif">Diagrama de Código – Componente Despacho (Punto de Venta)</text>
<text x="40" y="1614" font-size="18" fill="#555" font-family="'Segoe UI', 'Open Sans', Arial, sans-serif">Nivel 4 del modelo C4: clases principales del módulo de despacho en Laravel con Arquitectura Hexagonal (representación simplificada).</text></svg>