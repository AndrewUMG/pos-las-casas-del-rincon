services:
  postgres:
    image: postgres:16
    container_name: pos_rincon_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: pos_rincon
      POSTGRES_USER: pos_user
      POSTGRES_PASSWORD: pos_secret
    ports:
      - "5433:5432"
    volumes:
      - pos_rincon_data:/var/lib/postgresql/data

volumes:
  pos_rincon_data:
