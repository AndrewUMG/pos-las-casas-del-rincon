nicia)</text><text x="1292" y="872" font-size="21" font-weight="400" fill="#fff" text-anchor="start" font-family="Calibri, 'Segoe UI', Arial, sans-serif">y cierre (con cuánto cierra al momento del corte de</text><text x="1292" y="902" font-size="21" font-weight="400" fill="#fff" text-anchor="start" font-family="Calibri, 'Segoe UI', Arial, sans-serif">caja).</text></svg>