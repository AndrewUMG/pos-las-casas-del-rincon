', Georgia, serif">DOMINIO</text><text x="955" y="538.0" font-size="16" font-weight="400" fill="#fff" text-anchor="middle" font-family="Calibri, 'Segoe UI', Arial, sans-serif">Promocion (5 tipos)</text><text x="955" y="560.0" font-size="16" font-weight="400" fill="#fff" text-anchor="middle" font-family="Calibri, 'Segoe UI', Arial, sans-serif">CuponQR (token)</text><text x="955" y="582.0" font-size="16" font-weight="400" fill="#fff" text-anchor="middle" font-family="Calibri, 'Segoe UI', Arial, sans-serif">PuntosCliente</text><text x="955" y="604.0" font-size="16" font-weight="400" fill="#fff" text-anchor="middle" font-family="Calibri, 'Segoe UI', Arial, sans-serif">ReglaDescuento</text><polygon points="768.0,497.0 770.0,497.0 770.0,484.0 800.0,510.0 770.0,536.0 770.0,523.0 768.0,523.0 782.0,510.0" fill="#E4032E"/><polygon points="1112.0,497.0 1116.0,497.0 1116.0,484.0 1146.0,510.0 1116.0,536.0 1116.0,523.0 1112.0,523.0 1126.0,510.0" fill="#E4032E"/><polygon points="1456.0,497.0 1496.0,497.0 1496.0,484.0 1526.0,510.0 1496.0,536.0 1496.0,523.0 1456.0,523.0 1470.0,510.0" fill="#E4032E"/><rect x="60" y="770" width="1180" height="230" rx="6" fill="#1F1F1F" stroke="#333333" stroke-width="1.5"/><text x="82" y="802" font-size="13" font-weight="700" fill="#E4032E" text-anchor="start" letter-spacing="2" font-family="Calibri, 'Segoe UI', Arial, sans-serif">REGLAS DE NEGOCIO DEL DOMINIO</text><polygon points="84.0,839.0 87.5,833.0 94.5,833.0 98.0,839.0 94.5,845.0 87.5,845.0" fill="#E4032E"/><text x="110" y="844" font-size="19" font-weight="400" fill="#F4F4F4" text-anchor="start" font-family="Calibri, 'Segoe UI', Arial, sans-serif">Tipos: producto gratuito, vale de regalo, segundo producto a mitad de precio, compra por mayoreo y puntos por producto.</text><polygon points="84.0,875.0 87.5,869.0 94.5,869.0 98.0,875.0 94.5,881.0 87.5,881.0" fill="#E4032E"/><text x="110" y="880" font-size="19" font-weight="400" fill="#F4F4F4" text-anchor="start" font-family="Calibri, 'Segoe UI', Aria