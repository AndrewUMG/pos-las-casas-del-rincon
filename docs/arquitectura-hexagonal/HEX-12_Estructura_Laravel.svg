QL)</text><text x="1310" y="617" font-size="16" fill="#F4F4F4" xml:space="preserve" font-family="'Courier New', Consolas, monospace">config/database.php</text><text x="1310" y="644" font-size="16" fill="#F4F4F4" xml:space="preserve" font-family="'Courier New', Consolas, monospace">  DB_CONNECTION=pgsql</text><rect x="60" y="745" width="1180" height="255" rx="6" fill="#1F1F1F" stroke="#333333" stroke-width="1.5"/><text x="82" y="777" font-size="13" font-weight="700" fill="#E4032E" text-anchor="start" letter-spacing="2" font-family="Calibri, 'Segoe UI', Arial, sans-serif">ENSAMBLAJE CON INYECCIÓN DE DEPENDENCIAS</text><text x="84" y="808" font-size="16" fill="#7fb77e" xml:space="preserve" font-family="'Courier New', Consolas, monospace">// app/Providers/HexagonalServiceProvider.php</text><text x="84" y="836" font-size="16" fill="#F4F4F4" xml:space="preserve" font-family="'Courier New', Consolas, monospace">public function register(): void {</text><text x="84" y="864" font-size="16" fill="#F4F4F4" xml:space="preserve" font-family="'Courier New', Consolas, monospace">    $this-&gt;app-&gt;bind(VentaRepository::class, EloquentVentaRepository::class);</text><text x="84" y="892" font-size="16" fill="#F4F4F4" xml:space="preserve" font-family="'Courier New', Consolas, monospace">    $this-&gt;app-&gt;bind(InventarioPort::class,  InventarioAdapter::class);</text><text x="84" y="920" font-size="16" fill="#F4F4F4" xml:space="preserve" font-family="'Courier New', Consolas, monospace">    $this-&gt;app-&gt;bind(GeneradorQrPort::class, SimpleQrCodeAdapter::class);</text><text x="84" y="948" font-size="16" fill="#F4F4F4" xml:space="preserve" font-family="'Courier New', Consolas, monospace">}</text><rect x="1270" y="745" width="590" height="255" rx="6" fill="#E4032E" stroke="#E4032E" stroke-width="1.5"/><text x="1292" y="777" font-size="13" font-weight="700" fill="#fff" text-anchor="start" letter-spacing="2" font-family="Calibri, 'Segoe UI', Arial, sans-serif">REGLA DE DEPENDENCIA</